name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # Chỉ cài các gói nhẹ cần cho pytest; torch, recbole, faiss không cài trong CI.
      # Bổ sung vào danh sách khi test trong src/ bắt đầu import thêm thư viện.
      - name: Install dependencies
        run: |
          grep -E '^(numpy|scipy|pandas|pyyaml|scikit-learn|pytest)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Run tests
        run: pytest
